

services:
  app:
    build: .
    container_name: developer-learning-hub
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Update these to match your config variables in src/core/settings.py
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: MYsql@2004
      MYSQL_DB: Devatlas
    volumes:
      - ./uploads:/app/uploads

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: MYsql@2004
      MYSQL_DATABASE: Devatlas
      
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pMYsql@2004"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

